<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Controtek — Power Distribution Site Survey</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Power Survey">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7F9;--card:#fff;--c2:#F1F3F6;--tx:#1B2029;--mu:#5F6B7C;--bd:#D9DEE6;--ac:#E8301A;--ok:#1E8E4E;--no:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1A1D23;--c2:#22262E;--tx:#E9ECF1;--mu:#98A3B5;--bd:#2D323C;--ac:#FF6A52}}
:root[data-theme="dark"]{--bg:#111317;--card:#1A1D23;--c2:#22262E;--tx:#E9ECF1;--mu:#98A3B5;--bd:#2D323C;--ac:#FF6A52}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}*{box-sizing:border-box}
.phd,.pft{display:none}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Inter',system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#topbar{background:var(--card);border-bottom:3px solid var(--ac);padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#topbar img{height:34px;background:#fff;border-radius:4px}
#topbar .brand{display:none}
#topbar .title{font-size:16px;margin:0;color:var(--tx);font-weight:600}
.btn{background:var(--c2);border:1px solid var(--bd);color:var(--tx);padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.danger{background:var(--card);border-color:var(--no);color:var(--no)}
nav#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
nav#nav button{white-space:nowrap;background:var(--c2);color:var(--tx);border:1px solid transparent;padding:8px 16px;border-radius:20px;font-size:13.5px;font-weight:500;cursor:pointer}
nav#nav button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#shell{max-width:900px;margin:0 auto;padding:14px 14px 48px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ac);color:var(--tx)}
.desc{color:var(--mu);font-size:13px;margin:6px 0 8px}
.chip{display:inline-flex;padding:6px 12px;margin:3px 5px 3px 0;border-radius:18px;font-size:13px;background:var(--c2);border:1px solid var(--bd);color:var(--tx);cursor:pointer;font-weight:500}
.chip.on,.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.lb{font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 4px;text-transform:none;letter-spacing:0}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac)}
details>summary{cursor:pointer;font-weight:600;padding:6px 2px;font-size:14.5px;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';color:var(--ac);transition:transform .15s;display:inline-block}
details[open]>summary::before{transform:rotate(90deg)}
table.sm{border-collapse:collapse;width:100%;font-size:12px}table.sm td,table.sm th{border-bottom:1px solid var(--bd);padding:6px 7px;text-align:left}
table.sm th{background:var(--ac);color:#fff;font-weight:600}
.h{color:var(--no);font-weight:700}.m{color:#B7791F;font-weight:700}.l{color:var(--ok);font-weight:700}
select{font-family:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;font-size:13px;width:100%}
input[type=text],input[type=date],textarea{font-family:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;font-size:13px;width:100%;box-sizing:border-box}
@media print{@page{size:letter;margin:0}#topbar,nav#nav,.noprint{display:none}main{display:block;padding:1.05in .6in 1.75in;box-decoration-break:clone;-webkit-box-decoration-break:clone}.phd,.pft{display:block;position:fixed;left:0;width:100%}.phd{top:0}.pft{bottom:0}.card{margin-bottom:.22in;padding:.14in;break-inside:auto;box-decoration-break:clone;-webkit-box-decoration-break:clone;box-shadow:none;border-radius:6px}.card h2{break-after:avoid;color:#000;border-bottom:1px solid #999}.lb{break-after:avoid}table.sm tr{break-inside:avoid}table.sm tr:first-child{break-after:avoid}img{break-inside:avoid}body{background:#fff;color:#000;font-size:11.5px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

@media (max-width:640px){
  nav#nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:visible;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
  nav#nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 2px;border-radius:12px;white-space:normal;min-width:0}
  #shell,main{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .chip{padding:9px 14px;font-size:14px}
  #topbar{padding:10px 12px}
  #topbar .title,h1{font-size:14.5px}
  .btn{padding:9px 12px;font-size:12px}
  table.sm,.wrap{overflow-x:auto;display:block}
}

html{-webkit-text-size-adjust:100%}button,.chip,summary,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (pointer:coarse){input[type=text],input[type=date],textarea,select{font-size:16px !important;min-height:44px}.chip{min-height:40px}}
@media (min-width:768px) and (pointer:coarse){#shell,main{max-width:1000px}.chip{padding:9px 16px;font-size:14.5px}.item{padding:12px 0}}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.stat{background:var(--c2);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:12.5px;color:var(--mu)}.stat b{display:block;font-size:28px;color:var(--ac);line-height:1.1}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;margin:4px 0;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}.subrow .cnt{color:var(--mu);font-size:12.5px;white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 .desc{margin:8px 0 3px}
.ecard{border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0;background:var(--card)}
.sname{font-size:15px;font-weight:700}.scode{font-size:11px;font-weight:600;background:var(--c2);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin-left:6px;color:var(--mu)}.smeta{font-size:12px;color:var(--mu);font-weight:400;margin-top:2px;line-height:1.35}
.chip.cta{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
a{color:var(--ac)}
.sub>summary{align-items:flex-start}.sub>summary::before{margin-top:3px}

/* ---- v2 additions ---- */
textarea{resize:vertical;min-height:56px}
.good{color:var(--ok);font-weight:600}.bad{color:var(--no);font-weight:600}.warn{color:#B7791F;font-weight:600}
.sub>summary::before,.eq>summary::before{content:'▶';font-size:11px;margin-top:4px}
.sub[open]>summary::before,.eq[open]>summary::before{content:'▼';transform:none}
.sub>summary .sh,.eq>summary .eh{flex:1;min-width:0}
.sub>summary{align-items:center}.addq{margin:0;flex:none}
.ecard{background:var(--c2)}
.eq>summary{align-items:center;font-size:14px}.ename{font-weight:700;font-size:14px;word-break:break-word}
.th{width:46px;height:46px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);flex:none}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fi{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.chip{position:relative;overflow:hidden}
.pbtns{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.pv{display:block;max-width:100%;max-height:340px;margin-top:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);object-fit:contain}
.pv0{margin-top:8px;padding:16px;border:1px dashed var(--bd);border-radius:10px;color:var(--mu);font-size:12.5px;text-align:center}
.picker{background:var(--c2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:6px 0 10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;max-width:92%;display:none;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.tw{overflow-x:auto}
table.kv th{background:var(--c2);color:var(--tx);width:34%;vertical-align:top}table.kv td{vertical-align:top}
table.rdt th:first-child{background:var(--c2);color:var(--tx)}
.rd{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:700;font-size:12px;color:#fff}
.rd-High{background:var(--ok)}.rd-Medium{background:#B7791F}.rd-Low{background:var(--no)}.rd-NA{background:var(--mu)}
.pri{display:inline-block;min-width:58px;text-align:center;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;border:1px solid currentColor;margin-right:6px}
ol.recs{padding-left:20px}ol.recs li{margin:7px 0}
.cover{text-align:center;padding:28px 16px}.cover .clogo{height:56px;background:#fff;border-radius:6px;margin-bottom:18px}
.ctitle{font-size:26px;font-weight:700;margin:6px 0}.csub{font-size:17px;color:var(--mu);margin-bottom:18px}.cover table{max-width:460px;margin:0 auto;text-align:left}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pfig{margin:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}.pfig img{width:100%;height:190px;object-fit:cover;display:block}.pfig figcaption{padding:8px 10px;font-size:12px;color:var(--mu)}.pfig figcaption b{color:var(--tx)}
@media(max-width:480px){.g3{grid-template-columns:1fr 1fr}.g3>div:nth-child(3){grid-column:1/-1}.sub>summary{flex-wrap:wrap}.addq{margin-left:22px}}
@media print{
 .toast{display:none!important}
 .cover{min-height:7.2in;display:flex;flex-direction:column;justify-content:center;break-after:page;border:0}
 .sec.pb{break-before:page}
 .pgrid{grid-template-columns:1fr 1fr}.pfig{break-inside:avoid}.pfig img{height:2.3in}
 .rd,.pri{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .tw{overflow:visible}
 table.sm,.wrap{display:table!important;overflow:visible!important}
}

.mapbox{position:relative;z-index:0;height:400px;border-radius:10px;border:1px solid var(--bd);margin:8px 0;background:var(--c2)}
.mapbox>p{padding:20px;text-align:center}
.pin{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#1D6FE8;color:#fff;font:700 13px Inter,Arial,sans-serif;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55)}
.pin.m{background:#E8301A;border-radius:7px;width:32px;height:32px;font-size:17px}
.maplg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;margin:4px 0 10px}
.maplg span{display:inline-flex;align-items:center;gap:6px}.maplg .pin{width:20px;height:20px;font-size:11px;border-width:1px}.maplg .pin.m{width:22px;height:22px;font-size:12px}
@media print{.mapbox{height:3.7in;break-inside:avoid}.leaflet-control-container{display:none}}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}.dlgb{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;max-width:380px;width:100%}.dlgb .btn{margin:4px 4px 0 0}@media print{.dlg{display:none!important}}

/* ---- v3: multi-photo, personnel, photo viewer ---- */
.phg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.phs{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}
.phi{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;cursor:zoom-in;background:var(--c2)}
.phi img{width:100%;height:100%;object-fit:cover;display:block}
.phl{font-size:12px;color:var(--mu)}
.phb2{display:flex;gap:4px;flex-wrap:wrap;padding:6px;justify-content:center}.phb2 .chip{margin:0;font-size:12px;padding:6px 10px}
.phn{display:flex;align-items:center;gap:6px;font-size:12px;flex:none}
.dlgb.phb{max-width:94vw;width:auto;text-align:center}.phb img{max-width:100%;max-height:70vh;display:block;margin:8px auto;border-radius:8px}
.assist{border:2px solid #E8301A}
.arow{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.anum{width:26px;height:26px;border-radius:50%;background:#E8301A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-top:8px;flex:none}
.afl{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}.arow>.chip{margin:6px 0 0}
@media(max-width:480px){.phg{grid-template-columns:1fr 1fr}.afl{grid-template-columns:1fr}}
@media print{.phg,.phb2{display:none}}
.archfig{margin:0}.archfig img{max-width:100%;height:auto;display:block;margin:0 auto;border:1px solid var(--bd);border-radius:8px;background:#fff}.archp img{max-width:100%;max-height:320px;display:block;margin:6px auto;border:1px solid var(--bd);border-radius:8px;background:#fff;cursor:zoom-in}.figcap{font-style:italic;font-size:12.5px;color:var(--mu);text-align:center;margin:8px 0 0}@media print{.archfig{break-inside:avoid}.figcap{color:#333}}

const AST={};
const astBox=id=>{const t=AST[id];return t?`<p class="desc ${t.t=="ok"?"good":t.t=="err"?"bad":""}">${esc(t.m)}</p>`:""};
const REGION=/region|calabarzon|mimaropa|bicol|visayas|luzon|mindanao|soccsksargen|caraga|barmm|\bncr\b|metro manila/i;
async function revGeo(o){
 const u="https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=en&lat="+encodeURIComponent(val(o.lat))+"&lon="+encodeURIComponent(val(o.lng));
 const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
 try{const r=await fetch(u,{signal:c.signal,headers:{Accept:"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}
function parseAddr(j){const a=(j&&j.address)||{};
 const street=[a.house_number,a.road].filter(Boolean).join(" ");
 let b=a.suburb||a.village||a.neighbourhood||a.quarter||a.hamlet||a.city_district||"";
 if(b&&!/^(brgy|barangay)/i.test(b))b="Brgy. "+b;
 const town=a.city||a.town||a.municipality||"";
 const c=[a.province,a.county,a.state_district,a.state,a.region].filter(Boolean),prov=c.find(x=>!REGION.test(x))||c[0]||"";
 return{street,barangay:b,town,province:prov}}
async function autoAddr(id,force){
 const get=()=>id==="master"?S.master:S.subs.find(x=>x.id===id),o=get();if(!o)return;
 if(!hasGps(o)){AST[id]={t:"err",m:"Capture or enter the GPS location first."};R();return}
 AST[id]={t:"busy",m:"Looking up the address from GPS..."};R();
 try{const j=await revGeo(o),p=parseAddr(j),t=get();if(!t)return;
  if(!p.street&&!p.barangay&&!p.town&&!p.province){AST[id]={t:"err",m:"No address was found for this location. Please type it manually."};R();return}
  [["address",p.street],["barangay",p.barangay],["town",p.town],["province",p.province]].forEach(([f,v])=>{if(v&&(force||!val(t[f])))t[f]=v});
  if(id!=="master")t.updated=Date.now();
  AST[id]={t:"ok",m:"Address detected from GPS: "+(fullAddr(t)||"-")+". Please verify, because map data for some barangays may be incomplete."};saveNow();R()}
 catch(e){AST[id]={t:"err",m:"Could not look up the address (internet connection needed). Please type it manually."};R()}}

 pts.forEach(p=>{const x=X(+p.o.lng,z)-ox,y=Y(+p.o.lat,z)-oy;g.lineWidth=3;g.strokeStyle="#fff";

let PDFB=false,PDFU="",PDFF=null;
async function savePdf(){

function pdfDialog(blob,name){

 <button class="btn primary" onclick="pdfShare()">Save / Share PDF</button> <button class="btn" onclick="window.open(PDFU,'_blank')">Open PDF</button> <button class="btn" onclick="document.getElementById('pdfdlg').style.display='none'">Close</button></div>`;
 d.style.display="flex";toast("PDF ready")}
function pdfShare(){
 try{if(navigator.canShare&&navigator.canShare({files:[PDFF]})){navigator.share({files:[PDFF],title:PDFF.name}).catch(()=>{});return}}catch(e){}
 const a=document.createElement("a");a.href=PDFU;a.download=PDFF.name;document.body.appendChild(a);a.click();a.remove()}
